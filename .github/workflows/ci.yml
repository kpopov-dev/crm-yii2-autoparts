name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, intl, mbstring, zip, bcmath, sockets
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Code style
        run: ./vendor/bin/phpcs --standard=PSR12 --ignore=vendor,runtime,web/assets .

      - name: Static analysis
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: Unit tests
        run: ./vendor/bin/phpunit

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
